<app-dialog [title]="'Page Editor'+(dataModified() ? ' *' : '')" [open]="open() && !innerOpen() && !deleteId()" (cancel)="onCancel()"
    (save)="onSave()">

    <div style="display:flex;flex-direction:column;">
        <table mat-table [dataSource]="editLists() || []" class="mat-elevation-z2" >

            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let row">{{ row.metadata.name }}</td>
            </ng-container>

            <ng-container matColumnDef="comment">
                <th mat-header-cell *matHeaderCellDef>Comment</th>
                <td mat-cell *matCellDef="let row">{{ row.metadata.comment }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let row; let i = index">
                    <button (click)="openDialog(row.id)" style="margin-right: 8px;width:28px;height:28px;" matMiniFab
                        aria-label="Example icon button with a menu icon">
                        <mat-icon style="font-size: 20px;width:20px;height:20px;">edit</mat-icon>
                    </button>
                    <button (click)="openDeleteDialog(row.id, row.metadata.name)" matMiniFab
                        style="width:28px;height:28px;"
                        aria-label="Example icon button with a menu icon">
                        <mat-icon style="font-size: 20px;width:20px;height:20px;">delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row style="position: sticky; top: 0;z-index: 999;" *matHeaderRowDef="columns"></tr>
            <tr mat-row  *matRowDef="let row; columns: columns;"></tr>
        </table>
        <br />

        <button (click)="openDialog(null)" matMiniFab
            style="position:sticky;bottom:16px;margin-left: auto;margin-right: 16px;width:35px;height:35px;"
            aria-label="Example icon button with a menu icon">
            <mat-icon style="font-size: 35px;width:35px;height:35px;">add</mat-icon>
        </button>

    </div>



</app-dialog>


<app-dialog title="Page Editor" [open]="innerOpen()" (cancel)="onDialogCancel()" (save)="onDialogSave()">
    <mat-form-field style="min-width: 100%;" class="example-full-width">
        <mat-label>Name</mat-label>
        <input matInput placeholder="Enter name" [ngModel]="editData()?.metadata?.name ?? ''"
            (ngModelChange)="onEditFieldChange('name', $event)">
    </mat-form-field>
    <mat-form-field style="min-width: 100%;" class="example-full-width">
        <mat-label>Comment</mat-label>
        <input matInput placeholder="Enter comment" [ngModel]="editData()?.metadata?.comment ?? ''"
            (ngModelChange)="onEditFieldChange('comment', $event)">
    </mat-form-field>
</app-dialog>

<app-dialog title="Delete Page" [open]="!!deleteId()" (cancel)="closeDeleteDialog()" saveText="Ok"
    (save)="onDeleteConfirm()">
    Are you sure you want to delete this page: "{{ deleteTitle() }}"?
</app-dialog>
