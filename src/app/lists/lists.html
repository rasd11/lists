@if (data()) {


@for (section of data().sections; track section.id) {
    <h2>{{ section.title }}</h2>

<table mat-table [dataSource]="section.items" class="mat-elevation-z2">
    <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row; let i = index">{{ i+1 }}</td>
    </ng-container>

    @for (item of data().sections[0].itemDefinition; track item.name) {
    <ng-container [matColumnDef]="item.name">
        <th mat-header-cell *matHeaderCellDef>{{ item.name }}</th>
        <td mat-cell *matCellDef="let row">{{ row[item.name] }}</td>
    </ng-container>
    }


    <tr mat-header-row *matHeaderRowDef="columns()"></tr>
    <tr mat-row *matRowDef="let row; columns: columns();"></tr>
</table>
<br />
}
}
@else {
<p>Data not loaded yet</p>
}
